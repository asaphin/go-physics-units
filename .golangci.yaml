version: "2"

linters:
  # Enable every linter, then opt out of the ones that don't fit this project.
  # CI pins the golangci-lint version, so new linters only arrive on an explicit upgrade.
  default: all
  disable:
    # Disabled since the original configuration.
    - depguard # no dependency policy to enforce
    - dupl # the measure types deliberately mirror each other
    - err113 # dynamic errors that name the offending unit are intended
    - forcetypeassert
    - gochecknoglobals # unit tables and registries are package-level by design
    - gocyclo # cyclop and gocognit cover complexity
    - ireturn # the public API returns interfaces by design
    - mnd # conversion factors are magic numbers by nature
    - paralleltest
    # Opinionated style checks added to golangci-lint after the original configuration.
    - funcorder
    - noinlineerr
    # Deprecated in favour of a new major version, or the successor of a linter disabled above.
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - wsl

  settings:
    interfacebloat:
      max: 24
    varnamelen:
      max-distance: 24
    wrapcheck:
      # Errors from this module's own packages need no extra wrapping.
      ignore-package-globs:
        - github.com/asaphin/go-physics-units/*

  exclusions:
    rules:
      # Table-driven tests are long and repetitive by nature.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - goconst
          - iface
          - maintidx
          - unparam
          - varnamelen

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
